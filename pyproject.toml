[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qasp"
version = "0.1.0"
description = "Quantum-Aware Secure Protocol for AI agent communication"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "QASP Contributors" }
]
keywords = [
    "quantum-safe",
    "cryptography",
    "post-quantum",
    "AI",
    "agents",
    "protocol",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Communications",
    "Typing :: Typed",
]
dependencies = [
    "liboqs-python>=0.10.0",
    "cryptography>=43.0.0",
    "cbor2>=5.6.0",
    "aioquic>=1.0.0",
    "mcp>=1.26.0",
    "a2a-python>=0.0.1",
    "base58>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.100.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]
fuzz = [
    "atheris>=2.3.0; sys_platform == 'linux'",
]
quic = [
    "aioquic>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/QASP"
Documentation = "https://github.com/QASP/docs"
Repository = "https://github.com/QASP"
Issues = "https://github.com/QASP/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qasp"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
    "RUF",    # Ruff-specific rules
]
ignore = [
    "S101",   # assert statements (needed for tests)
]

[tool.ruff.lint.isort]
known-first-party = ["qasp"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "oqs.*",
    "cbor2.*",
    "aioquic.*",
    "mcp.*",
    "a2a.*",
    "base58.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # assert_used - needed for tests
